<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>raiku</title>
<style>

  /* ======================================================
     EDIT YOUR STUFF HERE — this is the only part you need
     ====================================================== */
  :root{
    --display-name: "hello, im raiku :D";
    --subtext: "";
  }
  /* Links: edit the text + href for each <a> down in the
     "SOCIAL LINKS" section of the HTML body below. */
  /* ====================================================== */

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
    background:#000;
  }

  .bg{
    position:fixed;
    inset:0;
    background-image:url('assets/banner.jpg');
    background-size:cover;
    background-position:center;
    filter:blur(18px) brightness(.5);
    transform:scale(1.1);
    z-index:0;
  }
  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:380px;
    margin:40px 16px;
    padding:36px 28px 30px;
    text-align:center;
    background:rgba(15,15,15,.45);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    backdrop-filter:blur(6px);
    box-shadow:0 25px 60px rgba(0,0,0,.5);
  }

  .pfp{
    width:96px;height:96px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(255,255,255,.85);
    box-shadow:0 0 30px rgba(255,255,255,.25);
    margin-bottom:16px;
  }

  .name{
    font-size:21px;
    font-weight:700;
    color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }

  .subtext{
    margin-top:6px;
    font-size:13px;
    color:rgba(255,255,255,.65);
    letter-spacing:.3px;
  }

  .divider{
    height:1px;
    background:rgba(255,255,255,.15);
    margin:22px 0 18px;
  }

  /* SOCIAL LINKS */
  .links{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .link{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 16px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    transition:.2s;
    text-align:left;
  }
  .link:hover{
    background:rgba(255,255,255,.16);
    transform:translateY(-2px);
  }
  .link svg{
    width:19px;height:19px;
    fill:#fff;
    flex-shrink:0;
  }

  .footer{
    margin-top:22px;
    font-size:11px;
    color:rgba(255,255,255,.4);
    letter-spacing:.5px;
  }

  @media(max-width:420px){
    .card{padding:30px 20px 26px;}
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="card">

  <img class="pfp" src="assets/pfp.jpg" alt="pfp">

  <div class="name">hello, im raiku :D</div>
  <div class="subtext"></div>

  <div class="divider"></div>

  <!-- ==================== SOCIAL LINKS ====================
       Edit the href="" for each link below, and the text
       right after </svg> to change the label.
       ======================================================= -->

    <a class="link" href="https://example.com/" target="_blank">

      website
    </a>

  </div>

  <div class="footer">raiku.github.io</div>

</div>

</body>
</html>
